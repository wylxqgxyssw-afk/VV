<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>黑色极简 · 剧本智能助手</title>
  <link rel="manifest" href="manifest-chat.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#000000">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script src="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: '#000000',
            darker: '#121212',
            accent: '#165DFF',
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    :root {
      --font-size: 16px;
      --line-height: 1.6;
      --ai-font-size: 16px;
      --ai-line-height: 1.6;
      --user-text-color: #FFFFFF;
      --ai-text-color: #FFFFFF;
      --bubble-px: 16px;
      --bubble-py: 8px;
      --chat-h-padding: 16px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --panel-width: 380px;
      --panel-height: 50vh;
      --input-height-ratio: 0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #000; color: #fff;
      transition: background-color 0.3s, color 0.3s;
    }
    body {
      height: 100vh; height: 100dvh;
      position: fixed; top: 0; left: 0;
    }

    .layout-container {
      width: 100%; height: 100%;
      position: relative;
      display: flex; flex-direction: column;
    }

    .left-set-panel {
      width: 100%; height: 0; flex-shrink: 0;
      background: #121212; border-bottom: 1px solid #333;
      overflow-y: auto; overflow-x: hidden;
      padding: 0 16px;
      transition: height 0.3s ease, padding 0.3s ease, background-color 0.3s;
    }
    .left-set-panel.show {
      height: var(--panel-height);
      padding: 24px 16px;
    }

    .chat-main-panel {
      flex: 1;
      display: flex; flex-direction: column;
      min-height: 0; min-width: 0;
      background-color: #000;
      transition: background-color 0.3s;
    }

    #sample-preview-area {
      flex-shrink: 0;
      border-bottom: 1px solid #222;
      padding: 12px var(--chat-h-padding);
      background: #050505;
      max-height: 35%;
      overflow-y: auto;
      transition: background-color 0.3s;
    }
    .sample-label {
      font-size: 11px; color: #666;
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 8px;
    }

    #chat-box {
      flex: 1 1 auto;
      overflow-y: auto;
      min-height: 0;
      padding-left: var(--chat-h-padding);
      padding-right: var(--chat-h-padding);
      padding-bottom: 12px;
    }

    #summon-area { transition: all 0.3s ease; }
    #summon-btn { transition: all 0.2s ease; white-space: nowrap; letter-spacing: 0.3px; flex-shrink: 0; }
    #summon-btn.active-btn { background: #b8860b; color: #000; border: none; cursor: pointer; animation: summonPulse 2s ease-in-out infinite; font-weight: 600; }
    #summon-btn.active-btn:hover { background: #d4a017; transform: scale(1.03); }
    #summon-btn.active-btn:active { transform: scale(0.96); }
    #summon-btn.typing-btn { background: #333; color: #aaa; cursor: not-allowed; border: 1px solid #555; }
    #summon-btn.idle-btn { background: #2a2a2a; color: #666; cursor: not-allowed; border: 1px solid #333; }
    @keyframes summonPulse { 0%,100%{box-shadow:0 0 0 0 rgba(184,134,11,0.4);} 50%{box-shadow:0 0 0 8px rgba(184,134,11,0);} }
    #summon-status-text { font-size: 12px; line-height: 1.4; min-width: 0; }
    #summon-status-text.has-pending { color: #ccaa00; font-weight: 500; }

    #pending-dot {
      position: absolute; top: -2px; right: -3px;
      width: 9px; height: 9px; background: #ff4444;
      border-radius: 50%; border: 1.5px solid #000;
      pointer-events: none; animation: dotPulse 1.5s ease-in-out infinite;
    }
    @keyframes dotPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.5);} }

    .mobile-input-bar {
      display: flex; flex-shrink: 0;
      background: #000; border-top: none;
      padding: 8px 12px; padding-bottom: calc(8px + var(--safe-bottom));
      gap: 8px; align-items: flex-end;
      transition: background-color 0.3s;
    }

    body.is-large-screen .layout-container { flex-direction: row; }
    body.is-large-screen .chat-main-panel { order: 1; }
    body.is-large-screen .panel-resizer { order: 2; }
    body.is-large-screen .left-set-panel {
      order: 3; width: 0; height: 100%;
      border-left: 1px solid #333; border-right: none; border-bottom: none;
      transition: width 0.3s ease, padding 0.3s ease, background-color 0.3s;
    }
    body.is-large-screen .left-set-panel.show {
      width: var(--panel-width); height: 100%;
      padding: 24px 16px;
    }
    body.is-large-screen #close-drawer-btn { display: none; }

    body.is-large-screen.panel-left .chat-main-panel { order: 3; }
    body.is-large-screen.panel-left .panel-resizer { order: 2; }
    body.is-large-screen.panel-left .left-set-panel {
      order: 1; border-left: none; border-right: 1px solid #333;
    }

    .panel-resizer { display: none; }
    body.is-large-screen .panel-resizer {
      display: block; width: 4px; background: #333;
      cursor: col-resize; flex-shrink: 0; transition: background 0.2s;
    }
    body.is-large-screen .panel-resizer:hover,
    body.is-large-screen .panel-resizer.active { background: #165DFF; }

    #swap-panel-btn { display: none; }
    body.is-large-screen #swap-panel-btn { display: inline-block; }

    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    .avatar-img, .avatar-placeholder {
      object-fit: cover; width: 100%; height: 100%; border-radius: 4px;
    }
    .msg-avatar {
      width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0;
      overflow: hidden; background: #1a1a1a;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #888;
      transition: background-color 0.3s;
    }
    .message-row { min-width: 0; width: 100%; }
    .chat-bubble-content {
      word-wrap: break-word; word-break: break-word; white-space: pre-wrap;
      max-width: 100%; overflow-wrap: break-word;
      font-size: var(--font-size); line-height: var(--line-height);
      padding: var(--bubble-py) var(--bubble-px);
      transition: font-size 0.2s, line-height 0.2s, background-color 0.3s, color 0.3s;
    }
    
    /* 强制应用 AI 的独立字号和行距 */
    .ai-bubble {
      font-size: var(--ai-font-size, var(--font-size)) !important;
      line-height: var(--ai-line-height, var(--line-height)) !important;
      background-color: #000 !important; color: var(--ai-text-color); border: 1px solid #333;
    }
    .user-bubble { background-color: #000 !important; color: var(--user-text-color); border: 1px solid #333; }
    
    .katex { font-size: var(--font-size); line-height: var(--line-height); display: inline-block; vertical-align: bottom; }
    .collapsible-settings { display: none; }
    .name-tag { cursor: pointer; transition: all 0.2s; border-bottom: 1px dashed transparent; }
    .name-tag:hover { border-bottom-color: #888; color: #ccc; }
    .name-tag .fa-pencil { opacity: 0; transition: opacity 0.2s; font-size: 0.7em; margin-left: 4px; }
    .name-tag:hover .fa-pencil { opacity: 0.7; }
    .msg-name-label {
      font-size: 0.7em; opacity: 0.7; letter-spacing: 0.5px;
      margin-bottom: 3px; display: block; cursor: pointer;
    }
    
    .chat-header, .chat-footer { flex-shrink: 0; transition: background-color 0.3s; }
    .sync-status { font-size: 10px; opacity: 0.5; margin-top: 2px; }
    .mark-help { background: #0a0a0a; border: 1px solid #333; border-radius: 6px; padding: 8px 10px; font-size: 11px; line-height: 1.7; color: #aaa; }
    .mark-help code { background: #222; padding: 1px 4px; border-radius: 3px; color: #fff; font-family: monospace; }
    .preset-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .preset-row.full { grid-template-columns: 1fr; }
    .preset-label { font-size: 11px; color: #888; margin-bottom: 2px; }
    .preset-input { width: 100%; background: #000; border: 1px solid #333; border-radius: 4px; padding: 4px 6px; color: #fff; font-size: 12px; outline: none; }
    select.preset-input { height: 26px; }
    .preset-group-title { font-size: 12px; color: #ccc; margin: 10px 0 6px; padding-left: 4px; border-left: 2px solid #165DFF; }
    #close-drawer-btn { display: block; margin-left: auto; }

    .regenerate-btn-container { opacity: 0.7; transition: opacity 0.2s; }
    .regenerate-btn-container:hover { opacity: 1; }

    #file-upload-btn {
      background: transparent; border: none; color: #888; cursor: pointer;
      padding: 4px; display: flex; align-items: center; justify-content: center;
      transition: color 0.2s; width: 36px; height: 36px;
      border-radius: 50%; border: 1.5px solid #444; flex-shrink: 0;
    }
    #file-upload-btn:hover { color: #fff; border-color: #888; }
    #file-upload-btn i { font-size: 16px; }

    #send-btn {
      background: #165DFF; border: none; color: #fff; cursor: pointer;
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.2s; font-size: 16px;
    }
    #send-btn:hover { background: #3b7bff; transform: scale(1.05); }
    #send-btn:active { transform: scale(0.95); }
    #send-btn i { font-size: 16px; line-height: 1; }

    #msg-input {
      background: #121212; border: 1.5px solid #2a2a2a;
      border-radius: 20px; padding: 10px 16px; color: #fff;
      outline: none; font-size: 14px; transition: border-color 0.2s, background-color 0.3s;
      flex: 1; min-width: 0; resize: none;
      font-family: inherit; line-height: 1.5;
      max-height: 120px;
      overflow-y: auto;
    }
    #msg-input:focus { border-color: #444; }
    #msg-input::placeholder { color: #555; }
    #msg-input::-webkit-scrollbar { display: none; }

    /* === 新增：偏好设置面板（DeepSeek风格） === */
    #preferences-modal {
      position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    #preferences-modal.show { opacity: 1; pointer-events: auto; }
    .prefs-card {
      width: 100%; max-width: 420px; background: #1e1e1e; border-radius: 16px;
      overflow: hidden; display: flex; flex-direction: column; max-height: 80vh;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5); border: 1px solid #333;
    }
    .prefs-header { padding: 16px 20px; font-size: 16px; font-weight: 600; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 12px; }
    .prefs-header button { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; }
    .prefs-list { padding: 8px; }
    .prefs-item { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-radius: 8px; font-size: 15px; transition: background 0.2s; }
    .prefs-item:hover { background: rgba(255,255,255,0.08); }
    .prefs-body { padding: 20px; overflow-y: auto; }
    .prefs-group { margin-bottom: 24px; }
    .prefs-group-title { font-size: 14px; margin-bottom: 10px; color: #ccc; font-weight: 500; display: flex; justify-content: space-between; }
    .theme-options { display: flex; gap: 24px; }
    .theme-options label { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; color: #eee; }
    .prefs-slider { width: 100%; height: 6px; background: #333; border-radius: 3px; outline: none; -webkit-appearance: none; }
    .prefs-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #165DFF; cursor: pointer; border: 2px solid #fff; }
    
    /* 显眼的偏好设置按钮 */
    #open-prefs-btn {
      background: linear-gradient(135deg, #165DFF, #0e3eb3) !important;
      border: none !important; color: #fff !important;
      border-radius: 8px; padding: 12px; font-weight: 600;
    }

    /* === 新增：浅色模式全局强制覆盖 === */
    body.light-mode {
      background-color: #ffffff !important;
      color: #1a1d21 !important;
    }
    body.light-mode .left-set-panel,
    body.light-mode .chat-header,
    body.light-mode .mobile-input-bar,
    body.light-mode .chat-main-panel,
    body.light-mode #sample-preview-area,
    body.light-mode #chat-box {
      background-color: #f7f8fa !important;
      border-color: #e5e7eb !important;
    }
    body.light-mode .ai-bubble,
    body.light-mode .user-bubble {
      background-color: #ffffff !important;
      color: #1a1d21 !important;
      border-color: #e5e7eb !important;
    }
    body.light-mode .bg-dark, 
    body.light-mode .bg-darker, 
    body.light-mode .bg-black,
    body.light-mode .bg-gray-800 { background-color: #f3f4f6 !important; border-color: #e5e7eb !important; color: #1a1d21 !important;}
    body.light-mode .text-white, 
    body.light-mode .text-gray-300, 
    body.light-mode .text-gray-400 { color: #1a1d21 !important; }
    body.light-mode .text-gray-500 { color: #6b7280 !important; }
    body.light-mode #msg-input { background: #fff !important; border-color: #d1d5db !important; color: #1a1d21 !important; }
    body.light-mode .mark-help { background: #fff !important; border-color: #e5e7eb !important; color: #4b5563 !important; }
    body.light-mode .prefs-card { background: #ffffff; color: #1a1d21; border-color: #e5e7eb; }
    body.light-mode .prefs-header { border-color: #e5e7eb; }
    body.light-mode .prefs-header button { color: #1a1d21; }
    body.light-mode .prefs-item:hover { background: rgba(0,0,0,0.05); }
    body.light-mode .prefs-group-title { color: #4b5563; }
    body.light-mode .theme-options label { color: #1a1d21; }
  </style>
</head>
<body>
<div class="layout-container">
  <!-- 设置面板 -->
  <div class="left-set-panel scrollbar-hide" id="left-panel">
    <div class="flex items-center mb-4">
      <button class="text-gray-400 hover:text-white" id="close-drawer-btn">
        <i class="fa fa-times fa-lg"></i>
      </button>
      <button class="text-gray-400 hover:text-white ml-2" id="swap-panel-btn" title="切换面板左右位置">
        <i class="fa fa-exchange"></i>
      </button>
    </div>
    <h1 class="text-xl font-bold mb-4 text-white">剧本/人设设置</h1>
    <div class="text-xs text-gray-400 mb-3 text-center" id="header-sync-status">正在连接云端...</div>
    <div class="flex gap-2 mb-4">
      <button class="flex-1 bg-gray-800 rounded p-2 text-sm text-white" id="clear-chat">清空聊天</button>
      <button class="flex-1 bg-gray-800 rounded p-2 text-sm text-white" id="reset-script">重置剧本</button>
    </div>

    <!-- AI回复模式切换 -->
    <div class="bg-dark border border-gray-800 rounded p-3 mb-3">
      <h3 class="text-sm font-medium mb-2 text-white">🤖 AI回复模式</h3>
      <div class="flex items-center justify-between mb-1">
        <label class="text-xs text-gray-300 font-medium">手动触发回复模式</label>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" id="reply-mode-toggle" class="sr-only peer">
          <div class="w-9 h-5 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-yellow-600"></div>
        </label>
      </div>
      <p class="mode-toggle-desc text-gray-500">
        <strong>关闭</strong>（默认）：发送消息后AI<strong>自动</strong>回复<br>
        <strong>开启</strong>：发送消息后AI<strong>不回复</strong>，可连续发送多条消息，点击下方的<strong>「⚡召唤AI回复」</strong>按钮后AI才回复
      </p>
      <div id="summon-area" class="mt-3 pt-3 border-t border-gray-700" style="display:none;">
        <div class="flex items-center justify-between gap-3 flex-wrap">
          <span id="summon-status-text" class="text-xs text-gray-400">暂无待回复消息</span>
          <button id="summon-btn" class="px-4 py-2 rounded-lg text-sm font-medium idle-btn" disabled>⚡ 召唤AI回复</button>
        </div>
      </div>
    </div>

    <button class="w-full bg-gray-800 rounded p-2 mb-3 text-sm text-white" id="toggle-mark-help">
      <i class="fa fa-info-circle mr-1"></i> 查看样式标记写法
    </button>
    
    <!-- 头像/全局样式设置 -->
    <button class="w-full bg-gray-800 rounded p-2 mb-3 text-sm text-white" id="toggle-settings">
      <i class="fa fa-cog mr-1"></i> 展开头像/全局样式设置
    </button>
    <div class="collapsible-settings bg-dark border border-gray-800 rounded p-3 mb-3 space-y-3" id="collapsible-settings">
      <div><h3 class="text-sm text-gray-400 mb-1">智能体名称</h3><input class="w-full bg-darker rounded p-2 text-white outline-none" id="agent-name-set"></div>
      <div><h3 class="text-sm text-gray-400 mb-1">智能体头像</h3><button class="w-full bg-accent/20 rounded p-2 text-sm mb-2 text-white" id="agent-avatar-upload">上传头像</button><input type="file" id="agent-avatar-file" class="hidden" accept="image/*"><div id="agent-avatar-preview" class="w-14 h-14 bg-accent/20 flex items-center justify-center overflow-hidden rounded-lg mx-auto"><span>预览</span></div></div>
      <div class="border-t border-gray-700 pt-3"><h3 class="text-sm text-gray-400 mb-1">你的名称</h3><input class="w-full bg-darker rounded p-2 text-white outline-none" id="user-name"></div>
      <div><h3 class="text-sm text-gray-400 mb-1">你的头像</h3><button class="w-full bg-accent/20 rounded p-2 text-sm mb-2 text-white" id="user-avatar-upload">上传头像</button><input type="file" id="user-avatar-file" class="hidden" accept="image/*"><div id="user-avatar-preview" class="w-14 h-14 bg-accent/20 flex items-center justify-center overflow-hidden rounded-lg mx-auto"><span>预览</span></div></div>
      
      <div class="border-t border-gray-700 pt-3"><h3 class="text-sm text-gray-400 mb-2">其他全局样式</h3>
        <div class="grid grid-cols-2 gap-2 mb-2">
          <div><label class="text-xs text-gray-400">我的文字颜色</label><input type="color" id="user-text-color" value="#FFFFFF" class="w-full h-8 style-live-input"></div>
          <div><label class="text-xs text-gray-400">AI文字颜色</label><input type="color" id="ai-text-color" value="#FFFFFF" class="w-full h-8 style-live-input"></div>
        </div>
        <div class="grid grid-cols-2 gap-2 mb-2">
          <div><label class="text-xs text-gray-400">气泡水平边距(px)</label><input type="number" id="bubble-px" value="16" class="w-full bg-darker rounded p-2 text-white style-live-input"></div>
          <div><label class="text-xs text-gray-400">气泡垂直边距(px)</label><input type="number" id="bubble-py" value="8" class="w-full bg-darker rounded p-2 text-white style-live-input"></div>
        </div>
        <div class="mb-2">
          <label class="text-xs text-gray-400">屏幕边缘距离(px)</label>
          <input type="number" id="chat-h-padding" value="16" class="w-full bg-darker rounded p-2 text-white style-live-input">
        </div>
        
        <div class="border-t border-gray-700 pt-3 mt-3">
          <div class="flex items-center justify-between mb-1">
            <label class="text-xs text-gray-400">📐 输入框高度系数 (0=默认)</label>
            <span id="input-height-ratio-display" class="text-gray-400">0.00</span>
          </div>
          <input type="range" id="input-height-ratio" min="0" max="0.5" step="0.01" value="0" class="w-full">
        </div>
        
        <div class="border-t border-gray-700 pt-3 mt-3">
          <div class="flex items-center justify-between mb-1">
            <label class="text-xs text-gray-400 font-medium">⚡ AI回复打字速度</label>
            <span id="speed-display" class="text-xs text-accent font-mono font-bold">30ms</span>
          </div>
          <input type="range" id="typewriter-speed" value="30" min="5" max="100" step="5" class="w-full">
        </div>
        
        <div class="border-t border-gray-700 pt-3 mt-3">
          <div class="flex items-center justify-between">
            <label class="text-xs text-gray-400">显示版本切换 & 重新生成</label>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="show-version-regenerate" class="sr-only peer" checked>
              <div class="w-9 h-5 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-accent"></div>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- 剧本输入框 -->
    <div class="border-t border-gray-600 pt-3 mt-2 mb-3">
      <label class="text-sm font-medium text-gray-300 mb-2 block">📝 剧本内容</label>
      <textarea class="w-full h-40 bg-dark border border-gray-600 rounded p-3 text-white outline-none resize-none mb-2" placeholder="输入剧本内容，AI会根据剧本回答问题" id="agent-prompt"></textarea>
    </div>

    <button class="w-full bg-gray-800 rounded p-3 text-white mb-3" id="save-set">保存所有设置（同步云端）</button>
    
    <!-- 【核心】显眼的偏好设置按钮 -->
    <button class="w-full mt-2 flex items-center justify-center gap-2" id="open-prefs-btn">
      <i class="fa fa-sliders"></i> 外观与偏好设置
    </button>
    
    <p class="text-xs text-gray-500 mt-3 mb-8 text-center" id="sync-status-text">数据自动云端同步，多端一致</p>
  </div>

  <!-- 拖拽分隔条 -->
  <div id="panel-resizer" class="panel-resizer"></div>

  <!-- 聊天主面板 -->
  <div class="chat-main-panel">
    <div class="chat-header p-3 border-b border-gray-800 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button class="text-gray-400 hover:text-white mr-1 relative" id="phone-open-set">
          <i class="fa fa-bars"></i>
          <span id="pending-dot" style="display:none;"></span>
        </button>
        <div id="agent-avatar" class="w-10 h-10 bg-accent/20 flex items-center justify-center overflow-hidden rounded-lg"><span class="avatar-placeholder">AI</span></div>
        <span id="agent-name-display" class="font-medium name-tag text-white">剧本助手 <i class="fa fa-pencil"></i></span>
      </div>
    </div>

    <!-- 历史消息列表 -->
    <div class="flex-1 overflow-y-auto scrollbar-hide" id="chat-box"></div>

    <!-- 底部输入栏 -->
    <div class="mobile-input-bar" id="mobile-input-area">
      <button id="file-upload-btn" title="上传文件/图片">
        <i class="fa fa-plus"></i>
      </button>
      <textarea id="msg-input" placeholder="输入消息..." rows="1"></textarea>
      <button id="send-btn">
        <i class="fa fa-arrow-up"></i>
      </button>
    </div>
    <input type="file" id="file-input" style="display:none" accept="*/*">
  </div>

  <!-- === 偏好设置弹窗 === -->
  <div id="preferences-modal">
    <div class="prefs-card">
      <!-- 主页 -->
      <div id="prefs-main-page">
        <div class="prefs-header">设置</div>
        <div class="prefs-list">
          <div class="prefs-item" id="go-to-appearance">
            <span>🎨 外观</span>
            <i class="fa fa-angle-right"></i>
          </div>
          <div class="prefs-item opacity-30" style="pointer-events:none;">
            <span>⚙️ 高级设置 (敬请期待)</span>
          </div>
          <div class="prefs-item opacity-30" style="pointer-events:none;">
            <span>👤 账号管理 (敬请期待)</span>
          </div>
        </div>
      </div>
      <!-- 外观子页 -->
      <div id="prefs-appearance-page" style="display:none;">
        <div class="prefs-header">
          <button id="back-to-main"><i class="fa fa-angle-left mr-2"></i>外观</button>
        </div>
        <div class="prefs-body">
          <!-- 主题 -->
          <div class="prefs-group">
            <div class="prefs-group-title">主题</div>
            <div class="theme-options">
              <label><input type="radio" name="theme" value="dark" checked> 深色</label>
              <label><input type="radio" name="theme" value="light"> 浅色</label>
            </div>
          </div>
          <!-- AI 回复字号 -->
          <div class="prefs-group">
            <div class="prefs-group-title" id="pref-ai-font-size-title">AI回复文字大小 (16px)</div>
            <input type="range" id="pref-ai-font-size" class="prefs-slider" min="12" max="24" step="1" value="16">
          </div>
          <!-- AI 行间距 -->
          <div class="prefs-group">
            <div class="prefs-group-title" id="pref-ai-line-height-title">AI回复行间距 (1.6)</div>
            <input type="range" id="pref-ai-line-height" class="prefs-slider" min="1.2" max="2.5" step="0.1" value="1.6">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    const SUPABASE_URL = 'https://vkeaimeytsymepgkizqk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_R66fP0xmbxUZTeu7kjQYjQ_FHdXlRvm';
    const AI_PROXY_URL = 'https://vkeaimeytsymepgkizqk.supabase.co/functions/v1/swift-api';
    const USER_ID = 'default';

    const WIDTH_THRESHOLD = 600;
    const ASPECT_RATIO_THRESHOLD = 0.85;

    function debounce(func, wait = 100) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    function checkIsLargeScreen() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      return width >= WIDTH_THRESHOLD && (width / height) >= ASPECT_RATIO_THRESHOLD;
    }

    function updateLayoutMode() {
      const isLarge = checkIsLargeScreen();
      document.body.classList.toggle('is-large-screen', isLarge);
      if (isLarge && leftPanel.classList.contains('show')) applyPanelWidth();
      updateInputHeight();
      setTimeout(() => { chatBox.scrollTop = chatBox.scrollHeight; }, 300);
    }

    function applyPanelWidth() {
      document.documentElement.style.setProperty('--panel-width', currentPanelWidth + 'px');
    }

    function splitHTMLIntoBlocks(html) {
      const blocks = [];
      const regex = /(<[^>]+>)|([^<]+)/g;
      let match;
      while ((match = regex.exec(html)) !== null) {
        if (match[1]) blocks.push(match[1]);
        else if (match[2]) {
          for (let char of match[2]) blocks.push(char);
        }
      }
      return blocks;
    }

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      realtime: { params: { eventsPerSecond: 10 } }
    });

    // DOM 元素
    const chatBox = document.getElementById('chat-box');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const leftPanel = document.getElementById('left-panel');
    const phoneOpenSet = document.getElementById('phone-open-set');
    const closeDrawerBtn = document.getElementById('close-drawer-btn');
    const swapPanelBtn = document.getElementById('swap-panel-btn');
    const toggleSettingsBtn = document.getElementById('toggle-settings');
    const collapsibleSettings = document.getElementById('collapsible-settings');
    const agentPrompt = document.getElementById('agent-prompt');
    const agentNameSet = document.getElementById('agent-name-set');
    const userNameInput = document.getElementById('user-name');
    const saveSetBtn = document.getElementById('save-set');
    const agentNameDisplay = document.getElementById('agent-name-display');
    const agentAvatarDiv = document.getElementById('agent-avatar');
    const syncStatusText = document.getElementById('sync-status-text');
    const headerSyncStatus = document.getElementById('header-sync-status');
    const panelResizer = document.getElementById('panel-resizer');
    
    // 偏好设置相关 DOM
    const preferencesModal = document.getElementById('preferences-modal');
    const openPrefsBtn = document.getElementById('open-prefs-btn');
    const prefsMainPage = document.getElementById('prefs-main-page');
    const prefsAppearancePage = document.getElementById('prefs-appearance-page');
    const goToAppearance = document.getElementById('go-to-appearance');
    const backToMain = document.getElementById('back-to-main');
    
    // 状态变量
    let currentAgentName = '剧本助手';
    let currentUserName = '我';
    let agentAvatarUrl = '';
    let userAvatarUrl = '';
    let messages = [];
    let isOnline = false;
    let isTyping = false;
    let typewriterSpeed = 30;
    let replyMode = 'auto';
    let lastAIResponseIndex = -1;

    // 主题与AI样式变量
    let themeMode = 'dark';
    let aiFontSize = 16;
    let aiLineHeight = 1.6;

    let stylePresets = {
      action: { outer: { color: '#888888', size: 14, weight: '300' }, inner: { color: '#888888', size: 14, weight: '300' }, prefix: '【', suffix: '】' },
      emph: { color: '#ffcc00', size: 16, weight: '700' },
      hideBrackets: true
    };

    let currentPanelWidth = 300;
    let inputHeightRatio = 0;
    let panelOnRight = true;

    // 自动调整 textarea 高度
    function autoResizeTextarea() {
      msgInput.style.height = 'auto';
      const scrollHeight = msgInput.scrollHeight;
      if (scrollHeight > 120) { msgInput.style.height = '120px'; msgInput.style.overflowY = 'auto'; } 
      else { msgInput.style.height = scrollHeight + 'px'; msgInput.style.overflowY = 'hidden'; }
    }

    function updateInputHeight() {
      const ratio = parseFloat(document.getElementById('input-height-ratio').value) || 0;
      inputHeightRatio = ratio;
      document.getElementById('input-height-ratio-display').textContent = ratio.toFixed(2);
      if (ratio > 0 && msgInput.offsetWidth > 0) {
        msgInput.style.height = (msgInput.offsetWidth * ratio) + 'px';
        msgInput.style.overflowY = 'auto';
      } else {
        msgInput.style.height = 'auto';
        autoResizeTextarea();
      }
    }

    // 面板拖拽逻辑
    let isResizing = false, startX = 0, startWidth = 0;
    panelResizer.addEventListener('mousedown', (e) => {
      if (!document.body.classList.contains('is-large-screen')) return;
      isResizing = true; startX = e.clientX; startWidth = leftPanel.getBoundingClientRect().width;
      panelResizer.classList.add('active'); document.body.style.userSelect = 'none'; e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      let delta = (panelOnRight ? -1 : 1) * (e.clientX - startX);
      let newWidth = Math.max(120, Math.min(startWidth + delta, Math.min(window.innerWidth * 0.9, 600)));
      currentPanelWidth = newWidth; applyPanelWidth(); updateInputHeight();
    });
    window.addEventListener('mouseup', () => {
      if (isResizing) { isResizing = false; panelResizer.classList.remove('active'); document.body.style.userSelect = ''; }
    });

    // 侧栏开关
    phoneOpenSet.addEventListener('click', () => {
      leftPanel.classList.toggle('show');
      if (leftPanel.classList.contains('show') && document.body.classList.contains('is-large-screen')) applyPanelWidth();
      updateInputHeight();
      setTimeout(() => { chatBox.scrollTop = chatBox.scrollHeight; }, 300);
    });
    closeDrawerBtn.addEventListener('click', () => { leftPanel.classList.remove('show'); updateInputHeight(); });

    // 折叠展开
    toggleSettingsBtn.addEventListener('click', () => {
      collapsibleSettings.style.display = collapsibleSettings.style.display === 'block' ? 'none' : 'block';
    });

    // === 核心：偏好设置逻辑 ===
    function applyTheme(mode) {
      themeMode = mode;
      if (mode === 'light') {
        document.body.classList.add('light-mode');
      } else {
        document.body.classList.remove('light-mode');
      }
    }

    function applyAIStyles() {
      document.documentElement.style.setProperty('--ai-font-size', aiFontSize + 'px');
      document.documentElement.style.setProperty('--ai-line-height', aiLineHeight);
      document.getElementById('pref-ai-font-size').value = aiFontSize;
      document.getElementById('pref-ai-line-height').value = aiLineHeight;
      document.getElementById('pref-ai-font-size-title').textContent = `AI回复文字大小 (${aiFontSize}px)`;
      document.getElementById('pref-ai-line-height-title').textContent = `AI回复行间距 (${aiLineHeight})`;
    }

    openPrefsBtn.addEventListener('click', () => {
      if (window.innerWidth < 860) { leftPanel.classList.remove('show'); updateInputHeight(); }
      preferencesModal.classList.add('show');
      prefsMainPage.style.display = 'block';
      prefsAppearancePage.style.display = 'none';
    });

    preferencesModal.addEventListener('click', (e) => {
      if (e.target.id === 'preferences-modal') preferencesModal.classList.remove('show');
    });

    goToAppearance.addEventListener('click', () => {
      prefsMainPage.style.display = 'none';
      prefsAppearancePage.style.display = 'block';
    });
    backToMain.addEventListener('click', () => {
      prefsMainPage.style.display = 'block';
      prefsAppearancePage.style.display = 'none';
    });

    // 关键修复：使用 querySelectorAll
    document.querySelectorAll('input[name="theme"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        applyTheme(e.target.value);
        saveSettingsToCloud();
      });
    });

    document.getElementById('pref-ai-font-size').addEventListener('input', (e) => {
      aiFontSize = parseInt(e.target.value);
      applyAIStyles();
    });
    document.getElementById('pref-ai-line-height').addEventListener('input', (e) => {
      aiLineHeight = parseFloat(e.target.value);
      applyAIStyles();
    });
    // 松开滑块时保存
    document.getElementById('pref-ai-font-size').addEventListener('change', saveSettingsToCloud);
    document.getElementById('pref-ai-line-height').addEventListener('change', saveSettingsToCloud);

    // 初始化设置
    async function loadSettingsFromCloud() {
      try {
        const { data, error } = await supabase.from('user_settings').select('*').eq('id', USER_ID).single();
        if (error && error.code !== 'PGRST116') throw error;
        if (data) {
          if (data.panel_position) { panelOnRight = (data.panel_position !== 'left'); document.body.classList.toggle('panel-left', !panelOnRight); }
          if (data.agent_prompt) agentPrompt.value = data.agent_prompt;
          if (data.agent_name) { currentAgentName = data.agent_name; agentNameSet.value = data.agent_name; }
          if (data.user_name) { currentUserName = data.user_name; userNameInput.value = data.user_name; }
          if (data.agent_avatar_url) { agentAvatarUrl = data.agent_avatar_url; agentAvatarDiv.innerHTML = `<img src="${agentAvatarUrl}" class="avatar-img">`; }
          if (data.theme) { themeMode = data.theme; applyTheme(themeMode); }
          if (data.ai_font_size) { aiFontSize = parseInt(data.ai_font_size); applyAIStyles(); }
          if (data.ai_line_height) { aiLineHeight = parseFloat(data.ai_line_height); applyAIStyles(); }
          if (data.typewriter_speed !== undefined) { typewriterSpeed = data.typewriter_speed; document.getElementById('typewriter-speed').value = typewriterSpeed; document.getElementById('speed-display').textContent = typewriterSpeed + 'ms'; }
          if (data.reply_mode !== undefined) { replyMode = data.reply_mode; document.getElementById('reply-mode-toggle').checked = (replyMode === 'manual'); }
          
          agentNameDisplay.innerHTML = `${currentAgentName} <i class="fa fa-pencil"></i>`;
          // ... 其他属性略，保证基础运行即可
        }
        updateSyncStatus('online', '云端已连接');
        return true;
      } catch (err) { 
        updateSyncStatus('offline', '离线模式');
        return false; 
      }
    }

    async function saveSettingsToCloud() {
      currentAgentName = agentNameSet.value || currentAgentName;
      currentUserName = userNameInput.value || currentUserName;
      
      const settings = {
        id: USER_ID,
        agent_prompt: agentPrompt.value,
        agent_name: currentAgentName,
        user_name: currentUserName,
        agent_avatar_url: agentAvatarUrl,
        theme: themeMode,
        ai_font_size: aiFontSize,
        ai_line_height: aiLineHeight,
        typewriter_speed: typewriterSpeed,
        reply_mode: replyMode,
        panel_position: panelOnRight ? 'right' : 'left',
        updated_at: new Date().toISOString()
      };

      try {
        const { error } = await supabase.from('user_settings').upsert(settings, { onConflict: 'id' });
        if (error) throw error;
        updateSyncStatus('online', '设置已保存');
      } catch (err) {
        updateSyncStatus('error', '仅本地有效');
      }
    }

    function updateSyncStatus(status, message) {
      headerSyncStatus.textContent = message;
      syncStatusText.textContent = message;
      isOnline = status === 'online';
    }

    // 发送与回复的基础逻辑
    async function sendMessage() {
      const value = msgInput.value.trim();
      if (!value) return;
      // ... 此处为简略示意，接入原有发送逻辑即可，不影响 UI 修复
      msgInput.value = '';
      autoResizeTextarea();
    }
    
    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    // 初始化
    async function init() {
      updateLayoutMode();
      await loadSettingsFromCloud();
      window.addEventListener('resize', debounce(updateLayoutMode));
    }

    init();
  })();
</script>
</body>
